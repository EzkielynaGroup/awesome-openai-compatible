name: Lint

on:
  pull_request:
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run awesome-lint
        run: npx --yes awesome-lint
